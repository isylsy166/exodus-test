server:
  port: 8080

spring:
  application:
    name: exodusTest

  datasource:
    url: jdbc:mysql://localhost:3306/exodus_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: exodus
    password: exodus
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 기동 시 schema/schema.sql 을 실행해 테이블을 보장한다.
  # (스크립트 초기화는 JPA EntityManagerFactory 생성보다 먼저 수행되므로 ddl-auto: validate 와 함께 쓸 수 있다)
  sql:
    init:
      mode: always
      schema-locations: classpath:schema/schema.sql

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
